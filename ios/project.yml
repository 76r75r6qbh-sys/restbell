# XcodeGen spec: run `xcodegen generate` in this folder to create Restbell.xcodeproj (which is not committed).
name: Restbell
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Restbell.xcconfig
  Release: Config/Restbell.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  RestbellKit:
    path: RestbellKit
targets:
  Restbell:
    type: application
    platform: iOS
    sources:
      - Restbell
      - Shared
    dependencies:
      - package: RestbellKit
      - target: RestbellWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).restbell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
    entitlements:
      path: Restbell/Restbell.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Remove this line if Xcode says your team can't use it; Health then syncs on open, in the background and via Shortcuts.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - $(APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).restbell.shared
    info:
      path: Restbell/Info.plist
      properties:
        CFBundleDisplayName: Restbell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: Restbell imports your Apple Watch workouts, heart rate, activity, sleep and weight so your coach can see training and recovery. The data goes only to your own Restbell server.
        NSHealthUpdateUsageDescription: Restbell can save your strength sessions as workouts and your logged meals as nutrition, if you turn that on.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [restbell.refresh, restbell.reconcile]
        CFBundleURLTypes:
          - CFBundleURLName: restbell
            CFBundleURLSchemes: [restbell]
        # A self-hosted server is often plain http on the LAN or Tailscale.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        RestbellAppGroup: $(APP_GROUP)
        RestbellKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).restbell.shared
  RestbellWidgets:
    type: app-extension
    platform: iOS
    sources:
      - RestbellWidgets
      - Shared
    dependencies:
      - package: RestbellKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).restbell.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
    entitlements:
      path: RestbellWidgets/RestbellWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).restbell.shared
    info:
      path: RestbellWidgets/Info.plist
      properties:
        CFBundleDisplayName: Restbell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        RestbellAppGroup: $(APP_GROUP)
        RestbellKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).restbell.shared
schemes:
  Restbell:
    build:
      targets:
        Restbell: all
    run:
      config: Debug
      commandLineArguments:
        "-demo": false
